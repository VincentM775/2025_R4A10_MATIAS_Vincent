<div class="card shadow-lg rounded-lg bg-white">
  <div class="card-body">
    <h3 class="text-xl font-bold text-blue-600">{{ voyage.destination }}</h3>
    <p class="text-gray-600 text-sm mt-2">{{ voyage.description.substring(0, 20) }}...</p>    
    <p class="text-lg font-semibold mt-4 text-blue-800">
      {{ voyage.prix.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' }) }}
    </p>

    <div class="mt-4 flex space-x-2">
      <button (click)="exploreVoyage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
        Explorer l'offre
      </button>
      
      <button (click)="confirmDelete()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
        Supprimer
      </button>
    </div>

    @if (showModal()) {
      <app-confirm-modal 
        [message]="'Voulez-vous supprimer ce voyage vers ' + voyage.destination + ' ?'"
        (confirm)="onConfirm()"
        (cancel)="onCancel()">
      </app-confirm-modal>
    }
  </div>
</div>
