<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-blue-500 to-blue-300 p-6">
  <h2 class="text-2xl font-bold text-white mb-4">Créer un nouveau voyage</h2>

  <button (click)="genererVoyage()" class="bg-white text-blue-500 px-6 py-2 rounded shadow-lg font-semibold hover:bg-blue-100">
    Générer un voyage
  </button>

  @if (voyage) {
    <div class="mt-6 p-4 bg-white rounded-lg shadow-md w-96 text-center">
      <h3 class="text-xl font-semibold text-blue-600">{{ voyage.destination }}</h3>
      <p class="text-gray-700 mt-2">{{ voyage.description }}</p>
      <p class="text-lg font-bold text-blue-500 mt-2">
        {{ voyage.prix.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' }) }}
      </p>
      <button (click)="validerVoyage()" class="mt-4 bg-green-500 text-white px-6 py-2 rounded shadow-lg font-semibold hover:bg-green-600">
        Valider le voyage
      </button>
    </div>
  }
</div>
