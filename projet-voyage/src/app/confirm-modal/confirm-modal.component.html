<div class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <p class="text-lg font-semibold text-gray-800">{{ message }}</p>
      
      <div class="mt-4 flex justify-end space-x-2">
        <button (click)="cancelAction()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Annuler</button>
        <button (click)="confirmAction()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Confirmer</button>
      </div>
    </div>
  </div>
