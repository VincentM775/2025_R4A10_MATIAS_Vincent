<footer class="gradient-bg">
  <div class="colonneFooter colGauche">
    <div id="boxLogo">
      <div id="logo">
        <img src="assets/images/header/EllipseBlanc.png" alt="Logo">
        <p id="Tlogo">T</p>
      </div>
      <p id="titreLogo">Trafalgar</p>
    </div>
    <p>
      Trafalgar provides progressive, and affordable healthcare, accessible on mobile and online for everyone
    </p>
    <p>©Trafalgar PTY LTD 2020. All rights reserved</p>
  </div>

  @for (section of sections; track $index) {
    <div class="colonneFooter">
      <h3 class="titreLink">{{ section.title }}</h3>
      @for (link of section.links; track $index) {
        <a class="link" [href]="link.href">{{ link.label }}</a>
      }
    </div>
  }
</footer>
