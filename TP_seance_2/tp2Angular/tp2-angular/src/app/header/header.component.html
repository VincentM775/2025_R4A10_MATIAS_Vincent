<header>
  <div class="header-top">
    <div id="boxLogo">
      <div id="logo">
        <img src="assets/images/header/Ellipse.png" alt="Logo">
        <p id="Tlogo">T</p>
      </div>
      <p id="titreLogo">Trafalgar</p>
    </div>
    <nav>
      @for (link of links; track $index) {
        <a [href]="link.href">{{ link.label }}</a>
      }
    </nav>
  </div>
  <div class="header-content">
    <div id="headerTexte">
      <h2 class="titre">Virtual healthcare for you</h2>
      <p class="sousTitre">
        Trafalgar provides progressive, and affordable healthcare, accessible on mobile and online for everyone
      </p>
      <button>Consult today</button>
    </div>
    <img src="assets/images/header/illustration.png" alt="Illustration">
  </div>
</header>
